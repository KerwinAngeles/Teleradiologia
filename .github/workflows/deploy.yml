# Construye las imágenes en GitHub Actions, las publica en GHCR y avisa a Coolify para que
# baje la nueva versión.
#
# Por qué no dejar que Coolify compile en la VPS: acá se compilan el SDK de .NET 10 (>1 GB) y
# el bundle de Vite. Hacerlo en la misma máquina que corre la app le come RAM y disco al Postgres
# y a Orthanc mientras dura el build. Compilando en CI, el deploy en la VPS es solo un `pull`.
#
# Requiere en el repo (Settings → Secrets and variables → Actions):
#   COOLIFY_WEBHOOK_URL  — el webhook de deploy del recurso (Coolify → recurso → Webhooks)
#   COOLIFY_TOKEN        — un API token de Coolify (Keys & Tokens → API tokens)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Si se pushea dos veces seguidas, cancelar el build viejo — no tiene sentido desplegarlo.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: ./backend
            dockerfile: ./backend/src/Teleradiologia.Api/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # GHCR rechaza mayúsculas en el nombre de la imagen y github.repository conserva las del
      # nombre de usuario/repo. Sin esto el push falla con "invalid reference format".
      - name: Normalizar el nombre del repo a minúsculas
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lower }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # El caché de Actions evita rehacer `dotnet restore` y `npm ci` en cada push.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Desplegar en Coolify
    # Solo si las DOS imágenes se publicaron: desplegar con una a medias deja el stack roto.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Disparar el deploy
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}"
