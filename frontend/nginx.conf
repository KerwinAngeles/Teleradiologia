# Configuración de nginx para el contenedor del frontend.
# Se copia a /etc/nginx/conf.d/default.conf, o sea que este archivo está dentro del bloque `http`.

# El TLS lo termina el proxy de Coolify (Traefik), que nos reenvía HTTP plano. Si pasáramos
# `$scheme` al API, vería "http" y con UseHttpsRedirection activo entraría en loop de 307.
# Reenviamos el proto original cuando el proxy de arriba lo mandó, y $scheme solo si no vino.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Un estudio de cientos de cortes pesa cientos de MB. El límite por defecto de nginx es 1 MB
    # y corta la subida con 413 antes de que llegue al API, que acepta hasta 200 MB
    # (ver [RequestSizeLimit] en EstudiosController). Un poco por encima para el overhead multipart.
    client_max_body_size 220M;

    # Subir un estudio grande por una conexión lenta lleva minutos; los timeouts por defecto
    # (60s) cortarían la subida a mitad de camino.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    server_tokens off;

    # DNS embebido de Docker. Hace falta porque abajo el upstream va en una variable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El API vive detrás del mismo dominio. `api` es el nombre del servicio en compose.
    location /api/ {
        # El upstream va en una VARIABLE a propósito. Con `proxy_pass http://api:8080` literal,
        # nginx resuelve el nombre una sola vez al arrancar: si el contenedor del API todavía no
        # existe, nginx se niega a levantar ("host not found in upstream"), y si el API se
        # recrea en un redeploy, nginx se queda con la IP vieja y devuelve 502 para siempre.
        # Con variable + resolver, resuelve por request y respeta el TTL.
        # Contrapartida: con variable nginx ya no reenvía la URI solo — hay que pasarla explícita.
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_set_header X-Forwarded-Host  $host;

        # Sin esto nginx buffea la subida entera a disco antes de tocar el API: con estudios de
        # cientos de MB duplica el I/O y demora el arranque de la subida.
        proxy_request_buffering off;
    }

    # SignalR: el WebSocket necesita Upgrade/Connection y un timeout largo, si no
    # nginx corta la conexión persistente al minuto.
    location /hubs/ {
        set $hub_upstream http://api:8080;
        proxy_pass $hub_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Los .wasm de los decodificadores DICOM de Cornerstone. Con el MIME equivocado,
    # WebAssembly.instantiateStreaming los rechaza y el visor no levanta.
    # La location por regex gana sobre la de prefijo /assets/, así que va primero.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite emite los assets con hash en el nombre: son inmutables, se cachean fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es quien apunta a los assets nuevos después de cada deploy.
    # Si se cachea, el navegador sigue pidiendo bundles viejos que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: cualquier ruta que no sea un archivo la resuelve el router de Vue.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
