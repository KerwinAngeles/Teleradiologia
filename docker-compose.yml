services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teleradiologia
      POSTGRES_USER: teleradiologia
      POSTGRES_PASSWORD: teleradiologia
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teleradiologia']
      interval: 5s
      timeout: 5s
      retries: 10

  # Mini-PACS: recibe, almacena y expone los estudios DICOM vía REST/DICOMweb.
  orthanc:
    image: orthancteam/orthanc:latest
    environment:
      ORTHANC__NAME: 'Teleradiologia'
      ORTHANC__REGISTERED_USERS: '{"admin": "admin"}'
    ports:
      - '4242:4242' # DICOM
      - '8042:8042' # HTTP / REST / DICOMweb / visor web integrado de Orthanc
    volumes:
      - orthanc-data:/var/lib/orthanc/db

  api:
    build:
      context: ./backend
      dockerfile: src/Teleradiologia.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=teleradiologia;Username=teleradiologia;Password=teleradiologia'
      Orthanc__BaseUrl: 'http://orthanc:8042'
      Cors__AllowedOrigins__0: 'http://localhost:5173'
    ports:
      - '5080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started

volumes:
  postgres-data:
  orthanc-data:
