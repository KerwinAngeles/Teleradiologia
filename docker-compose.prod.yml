# Stack de producción — pensado para desplegarse en Coolify.
#
# Diferencias clave contra docker-compose.yml (que es solo para desarrollo local):
#   · Postgres y Orthanc NO publican puertos. En una VPS, `ports:` es internet abierto: el visor
#     web de Orthanc dejaría navegar estudios de pacientes sin pasar por la API ni la auditoría.
#     Se hablan por la red interna de compose, igual que en dev (Host=postgres, http://orthanc:8042).
#   · Nada de secretos literales: todo sale de variables de entorno de Coolify (ver .env.prod.example).
#     Las marcadas con `:?` hacen fallar el arranque si faltan, en vez de levantar algo inseguro.
#   · No hay Mailpit: es un atrapa-emails de desarrollo. Acá va un SMTP real.
#   · El único servicio que se expone es `frontend` — nginx sirve la SPA y proxea /api al API.
#
# `image:` + `build:` juntos es intencional: si Coolify construye en la VPS, etiqueta el
# resultado con ese nombre; si preferís construir en CI (ver .github/workflows/deploy.yml),
# la misma etiqueta se baja del registro y `build:` queda sin usar.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teleradiologia}
      POSTGRES_USER: ${POSTGRES_USER:-teleradiologia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teleradiologia}']
      interval: 10s
      timeout: 5s
      retries: 10

  # Mini-PACS: recibe, almacena y expone los estudios DICOM vía REST/DICOMweb.
  # Sin `ports:` a propósito — el puerto DICOM (4242) y el REST (8042) quedan solo en la red interna.
  # Si algún día un hospital necesita mandar DICOM directo por 4242, eso va por VPN o mTLS, no abriendo el puerto.
  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    environment:
      ORTHANC__NAME: ${ORTHANC_NAME:-Teleradiologia}
      ORTHANC__REGISTERED_USERS: '{"${ORTHANC_USERNAME:-teleradiologia}": "${ORTHANC_PASSWORD:?falta ORTHANC_PASSWORD}"}'
    volumes:
      # Ojo con el tamaño: un TC de 361 cortes ronda los 180 MB. Este volumen necesita disco y backup.
      - orthanc-data:/var/lib/orthanc/db

  api:
    image: ${IMAGE_PREFIX:-teleradiologia}/api:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: src/Teleradiologia.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: 'Host=postgres;Port=5432;Database=${POSTGRES_DB:-teleradiologia};Username=${POSTGRES_USER:-teleradiologia};Password=${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}'

      Orthanc__BaseUrl: 'http://orthanc:8042'
      Orthanc__Username: ${ORTHANC_USERNAME:-teleradiologia}
      Orthanc__Password: ${ORTHANC_PASSWORD:?falta ORTHANC_PASSWORD}

      # Con nginx proxeando /api, el navegador nunca hace una petición cross-origin y CORS no
      # entra en juego. Se deja configurado por si algún día el API se sirve en otro dominio.
      Cors__AllowedOrigins__0: ${APP_URL:-}

      # Mínimo 32 bytes o la API se niega a arrancar (validación en Program.cs).
      # Generar con: openssl rand -base64 48
      Jwt__Key: ${JWT_KEY:?falta JWT_KEY (openssl rand -base64 48)}
      Jwt__Issuer: ${JWT_ISSUER:-Teleradiologia.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Teleradiologia.Frontend}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}

      # Solo se usa si la base arranca vacía. Cambiar esta contraseña apenas entrés la primera vez.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:?falta SEED_ADMIN_EMAIL}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:?falta SEED_ADMIN_PASSWORD}

      Email__SmtpHost: ${SMTP_HOST:?falta SMTP_HOST}
      # 465 y no 587: SmtpEmailSender solo sabe TLS-directo (SslOnConnect) o texto plano — no
      # implementa STARTTLS, que es lo que usa el 587. Ver la nota en el README.
      Email__SmtpPort: ${SMTP_PORT:-465}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:?falta SMTP_FROM_ADDRESS}
      Email__FromName: ${SMTP_FROM_NAME:-Teleradiología}
    depends_on:
      postgres:
        condition: service_healthy
      orthanc:
        condition: service_started
    healthcheck:
      # /api/health comprueba además que la conexión a Postgres esté viva.
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8080/api/health']
      interval: 30s
      timeout: 5s
      # La primera arranque corre migraciones + seed antes de escuchar: hay que darle aire.
      start_period: 60s
      retries: 5

  # Único servicio expuesto. En Coolify, el dominio se asigna a ESTE servicio, puerto 80.
  frontend:
    image: ${IMAGE_PREFIX:-teleradiologia}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - api

volumes:
  postgres-data:
  orthanc-data:
